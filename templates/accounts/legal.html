{% extends "base.html" %}

{% block title %}{{ page.title }} — Entropy{% endblock %}

{% block content %}
  <div class="entropy-card mx-auto max-w-3xl p-6 sm:p-10">
    <h1 class="text-2xl font-extrabold uppercase tracking-tight">{{ page.title }}</h1>
    <div class="mt-6 text-sm entropy-text-soft leading-relaxed whitespace-pre-wrap" style="line-height: 1.7;">
      {{ content }}
    </div>
    <p class="mt-8">
      <a href="{% url 'forum:post_list' %}" class="entropy-btn px-4 py-2 text-sm font-semibold">&larr; На главную</a>
    </p>
  </div>
{% endblock %}
