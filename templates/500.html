<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 — Ошибка сервера</title>
  {% load static %}
  <script>
  (function () {
    var k = "entropy-site-theme", s = localStorage.getItem(k);
    if (s === "light" || s === "dark") {
      document.documentElement.setAttribute("data-site-theme", s);
    } else {
      document.documentElement.setAttribute("data-site-theme",
        window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
  })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          borderRadius: { none: "0", DEFAULT: "0", sm: "0", md: "0", lg: "0", xl: "0", "2xl": "0", "3xl": "0", full: "0" }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/entropy-site.css' %}">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
  </style>
</head>
<body class="antialiased">
  <div class="entropy-card mx-auto max-w-lg p-10 text-center w-full" style="position:relative;">
    <div class="absolute -top-4 -right-4 entropy-badge-invert px-3 py-1 text-xs font-extrabold uppercase tracking-widest">
      Критическая ошибка
    </div>

    <p class="text-8xl font-extrabold leading-none tracking-tighter" aria-hidden="true">500</p>

    <div class="my-6 border-t entropy-border"></div>

    <h1 class="text-2xl font-extrabold uppercase tracking-tight">Сервер распался</h1>
    <p class="mt-3 text-sm entropy-text-muted">
      Внутренняя энтропия сервера превысила допустимый порог.
    </p>
    <p class="mt-1 text-sm entropy-text-faint">
      Попробуйте обновить страницу или вернуться позже.
    </p>

    <div class="mt-8 flex flex-wrap justify-center gap-3">
      <a href="/" class="entropy-btn-primary px-5 py-2.5 text-sm font-semibold">
        &larr; На главную
      </a>
    </div>
  </div>
</body>
</html>
